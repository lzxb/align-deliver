<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="400" viewBox="0 0 1160 400" role="img">
  <title>对齐交付 · 阶段 1 对齐</title>
  <rect width="1160" height="400" fill="#FFFFFF" />
  <text x="40" y="30" text-anchor="start" dominant-baseline="middle" font-size="21px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">对齐交付 · 阶段 1 对齐</text>
  <rect x="24" y="58" width="1112" height="250" rx="14" fill="none" stroke="#B4B2A9" stroke-dasharray="5 5" stroke-width="1" />
  <text x="45" y="81" text-anchor="start" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">1 · 对齐：用户定目标、原则和开工；AI 定原则内细节</text>
  <rect x="60" y="102" width="235" height="68" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" />
  <text x="177.5" y="124.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">A · 复述理解</text>
  <text x="177.5" y="148.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">最小示例 / AI 先说理解</text>
  <rect x="325" y="102" width="235" height="68" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" />
  <text x="442.5" y="124.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">B · 目标</text>
  <text x="442.5" y="148.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">一句话 / 完成标准</text>
  <path d="M295 136 L322 136" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M315 132 L322 136 L315 140" fill="none" stroke="#73726C" stroke-width="1.6" />
  <rect x="590" y="102" width="235" height="68" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" />
  <text x="707.5" y="124.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">C · 核心原则</text>
  <text x="707.5" y="148.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">skill 内置 / AI 读取并复述</text>
  <path d="M560 136 L587 136" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M580 132 L587 136 L580 140" fill="none" stroke="#73726C" stroke-width="1.6" />
  <rect x="855" y="102" width="235" height="68" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" />
  <text x="972.5" y="124.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">D · 任务原则</text>
  <text x="972.5" y="148.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">如 0 破坏 / 本任务讨论</text>
  <path d="M825 136 L852 136" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M845 132 L852 136 L845 140" fill="none" stroke="#73726C" stroke-width="1.6" />
  <rect x="420" y="205" width="320" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1" />
  <text x="580.0" y="228.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">E · 讨论清楚？</text>
  <text x="580.0" y="252.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">用户说“确认”或“开始”才算通过</text>
  <path d="M972 170 L972 240 L743 240" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M750 244 L743 240 L750 236" fill="none" stroke="#73726C" stroke-width="1.6" />
  <path d="M420 240 L177 240 L177 173" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M181 180 L177 173 L173 180" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="190" y="225" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">没清楚：围绕目标讨论原则</text>
  <path d="M580 275 L580 337" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M576 330 L580 337 L584 330" fill="none" stroke="#73726C" stroke-width="1.6" />
  <circle cx="580" cy="350" r="13" fill="#F7F6F2" stroke="#73726C" stroke-width="1" />
  <text x="580" y="350" text-anchor="middle" dominant-baseline="middle" font-size="13px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">F</text>
  <text x="603" y="350" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">阶段 2：F 批次</text>
  <text x="40" y="385" text-anchor="start" dominant-baseline="middle" font-size="12px" fill="#5F5E5A" font-family="STHeiti">圆点是其他阶段的节点；实线为正常路径，虚线为异常 / 旁路。</text>
</svg>
