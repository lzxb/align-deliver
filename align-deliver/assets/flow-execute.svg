  <text x="343" y="820" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">阶段 3：DT 交付物类型？</text>
  <circle cx="895" cy="820" r="13" fill="#F7F6F2" stroke="#73726C" stroke-width="1" />
