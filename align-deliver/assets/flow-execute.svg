  <text x="120" y="430" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">有修改：修复后再验收 → G</text>
  <path d="M320 520 L320 557" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M316 550 L320 557 L324 550" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="330" y="540" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">0 修改</text>
  <path d="M110 605 L60 605 L60 255 L107 255" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M100 251 L107 255 L100 259" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="120" y="540" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">无待定但仍有未完成工作 → G</text>
  <path d="M320 630 L320 803" stroke="#73726C" stroke-width="1.6" fill="none" />
