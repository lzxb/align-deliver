  <path d="M604 150 L600 143 L596 150" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="612" y="160" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">资料读取失败（如在线文档）</text>
  <path d="M320 300 L320 337" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M316 330 L320 337 L324 330" fill="none" stroke="#73726C" stroke-width="1.6" />
  <path d="M320 410 L320 447" stroke="#73726C" stroke-width="1.6" fill="none" />
