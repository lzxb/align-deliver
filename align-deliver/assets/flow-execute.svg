  <text x="688" y="600" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">无</text>
  <path d="M1070 707 L1122 707 L1122 470 L1073 470" stroke="#73726C" stroke-width="1.6" fill="none" />
