<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="900" viewBox="0 0 1160 900" role="img">
  <title>对齐交付 · 阶段 2 执行与验收</title>
  <rect width="1160" height="900" fill="#FFFFFF" />
  <text x="40" y="30" text-anchor="start" dominant-baseline="middle" font-size="21px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">对齐交付 · 阶段 2 执行与验收</text>
  <circle cx="320" cy="68" r="13" fill="#F7F6F2" stroke="#73726C" stroke-width="1" />
  <text x="320" y="68" text-anchor="middle" dominant-baseline="middle" font-size="13px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">E</text>
  <text x="343" y="68" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">阶段 1：用户说“确认”或“开始”</text>
  <path d="M320 81 L320 92" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M316 85 L320 92 L324 85" fill="none" stroke="#73726C" stroke-width="1.6" />
  <rect x="110" y="95" width="420" height="65" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" />
  <text x="320.0" y="115.5" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">F · 批次</text>
  <text x="320.0" y="139.5" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">默认 1 批，独立工作区</text>
  <circle cx="600" cy="127" r="13" fill="#FAEEDA" stroke="#854F0B" stroke-width="1" />
  <text x="600" y="127" text-anchor="middle" dominant-baseline="middle" font-size="13px" font-weight="600" fill="#854F0B" font-family="STHeiti">K</text>
  <path d="M530 127 L585 127" stroke="#73726C" stroke-width="1.6" fill="none" stroke-dasharray="5 5" />
  <path d="M578 123 L585 127 L578 131" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="538" y="142" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">远程失败</text>
  <text x="622" y="127" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">阶段 4：K 任一远程操作失败</text>
  <rect x="24" y="185" width="1112" height="590" rx="14" fill="none" stroke="#B4B2A9" stroke-dasharray="5 5" stroke-width="1" />
  <text x="45" y="208" text-anchor="start" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">2 · 本批执行与验收</text>
  <rect x="110" y="230" width="420" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" />
  <text x="320.0" y="253.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">G · 执行</text>
  <text x="320.0" y="277.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">按原则完成/修复</text>
  <rect x="110" y="340" width="420" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1" />
  <text x="320.0" y="363.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">H · 专家团验收</text>
  <text x="320.0" y="387.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">对照目标与两类原则</text>
  <rect x="110" y="450" width="420" height="70" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1" />
  <text x="320.0" y="473.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">I · 本轮修改数</text>
  <text x="320.0" y="497.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">大于 0 修复，等于 0 检查待定项</text>
  <rect x="110" y="560" width="420" height="70" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1" />
  <text x="320.0" y="595.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">T · 本批状态？</text>
  <rect x="720" y="230" width="350" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1" />
  <text x="895.0" y="253.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">Q · 原则缺失或冲突</text>
  <text x="895.0" y="277.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">或来回改不收敛</text>
  <rect x="720" y="340" width="350" height="70" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="1" />
  <text x="895.0" y="363.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">S · 记录待定项与影响范围</text>
  <text x="895.0" y="387.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">仅暂停依赖该原则的部分</text>
  <rect x="720" y="450" width="350" height="70" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1" />
  <text x="895.0" y="485.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">W · 还有可独立推进的工作？</text>
  <rect x="720" y="560" width="350" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" />
  <text x="895.0" y="583.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">U · 先完成并验证独立工作</text>
  <text x="895.0" y="607.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">不假定待定原则的答案</text>
  <rect x="720" y="670" width="350" height="75" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" />
  <text x="895.0" y="695.5" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">R · 汇总待定项后讨论原则</text>
  <text x="895.0" y="719.5" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">一次只问一个问题</text>
