  <text x="1112" y="652" text-anchor="end" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">新出现且已授权的独立工作</text>
  <path d="M895 745 L895 803" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M891 796 L895 803 L899 796" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="885" y="760" text-anchor="end" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">已有 MR 且暂无独立工作：保留待定范围</text>
  <circle cx="320" cy="820" r="13" fill="#F7F6F2" stroke="#73726C" stroke-width="1" />
