<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="790" viewBox="0 0 1160 790" role="img">
  <title>对齐交付 · 四个阶段</title>
  <rect width="1160" height="790" fill="#FFFFFF" />
  <text x="40" y="30" text-anchor="start" dominant-baseline="middle" font-size="21px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">对齐交付 · 四个阶段</text>
  <rect x="360" y="70" width="400" height="70" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1" />
  <text x="560.0" y="93.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">阶段 1 · 对齐</text>
  <text x="560.0" y="117.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">目标与原则</text>
  <rect x="360" y="210" width="400" height="70" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" />
  <text x="560.0" y="233.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">阶段 2 · 执行与验收</text>
  <text x="560.0" y="257.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">批次、专家团</text>
  <rect x="360" y="360" width="400" height="70" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1" />
  <text x="560.0" y="383.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">阶段 3 · 交付</text>
  <text x="560.0" y="407.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">git 走 MR，其他交给用户</text>
  <rect x="360" y="530" width="400" height="70" rx="10" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1" />
  <text x="560.0" y="553.0" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">阶段 4 · 盘点与维护</text>
  <text x="560.0" y="577.0" text-anchor="middle" dominant-baseline="middle" font-size="14px" fill="#5F5E5A" font-family="STHeiti">全部 MR 与交付物</text>
  <rect x="460" y="670" width="200" height="50" rx="25" fill="#F7F6F2" stroke="#73726C" stroke-width="1" />
  <text x="560" y="695" text-anchor="middle" dominant-baseline="middle" font-size="17px" font-weight="600" fill="#2C2C2A" font-family="STHeiti">结束</text>
  <path d="M560 140 L560 207" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M556 200 L560 207 L564 200" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="572" y="175.0" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">用户说“确认”或“开始”</text>
  <path d="M560 280 L560 357" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M556 350 L560 357 L564 350" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="572" y="320.0" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">0 修改、无待定且全部完成</text>
  <path d="M560 430 L560 527" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M556 520 L560 527 L564 520" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="572" y="462.0" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">已提交、已标记待交出、验收通过、</text>
  <text x="572" y="480.0" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">无差异或已覆盖、交出后维护 MR、</text>
  <text x="572" y="498.0" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">等待或远程失败</text>
  <path d="M560 600 L560 667" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M556 660 L560 667 L564 660" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="572" y="626.0" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">全部 MR 终态、非 git 已验收，</text>
  <text x="572" y="644.0" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">或无变更完成</text>
  <path d="M360 260 L330 260 L330 550 L357 550" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M350 546 L357 550 L350 554" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="322" y="391.0" text-anchor="end" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">待定且已有 MR、</text>
  <text x="322" y="409.0" text-anchor="end" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">远程失败</text>
  <path d="M360 580 L200 580 L200 230 L357 230" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M350 226 L357 230 L350 234" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="190" y="391.0" text-anchor="end" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">有可推进的工作、</text>
  <text x="190" y="409.0" text-anchor="end" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">恢复续接</text>
  <path d="M760 380 L800 380 L800 245 L763 245" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M770 249 L763 245 L770 241" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="815" y="320.0" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">需执行、CI 红、冲突、需修改</text>
  <path d="M760 565 L830 565 L830 410 L763 410" stroke="#73726C" stroke-width="1.6" fill="none" />
  <path d="M770 414 L763 410 L770 406" fill="none" stroke="#73726C" stroke-width="1.6" />
  <text x="845" y="462.0" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">待提交或待修复的 MR、</text>
  <text x="845" y="480.0" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">全部做完后交出非 git、</text>
  <text x="845" y="498.0" text-anchor="start" dominant-baseline="middle" font-size="13px" fill="#5F5E5A" font-family="STHeiti">已交出待验收、恢复续接</text>
  <text x="40" y="760" text-anchor="start" dominant-baseline="middle" font-size="12px" fill="#5F5E5A" font-family="STHeiti">细节见各阶段的流程图；进入某个阶段时，先读该阶段的文件。</text>
</svg>
