<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1020" viewBox="0 0 680 1020"><rect x="0" y="0" width="680" height="1020" fill="white" stroke="white" stroke-width="0.7" rx="0" /><rect x="24" y="20" width="632" height="992" fill="none" stroke="#C9C7BD" stroke-width="0.7" rx="16" stroke-dasharray="5 5" /><text x="40" y="42" font-family="STHeiti" font-size="16" fill="#444441" font-weight="500" text-anchor="start" dominant-baseline="central">MR 描述模板 · 只写审查所需内容</text><rect x="40" y="68" width="130" height="78" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7" rx="9" /><rect x="180" y="68" width="460" height="78" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.7" rx="9" /><text x="105" y="107.0" font-family="STHeiti" font-size="16" fill="#534AB7" font-weight="500" text-anchor="middle" dominant-baseline="central">目标</text><text x="196" y="96" font-family="STHeiti" font-size="15" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">一句话：要解决的问题 + 完成结果</text><text x="196" y="122" font-family="STHeiti" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">让读者理解本次交付，不搬入规则全文。</text><rect x="40" y="158" width="130" height="340" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.7" rx="9" /><rect x="180" y="158" width="460" height="340" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.7" rx="9" /><text x="105" y="328.0" font-family="STHeiti" font-size="16" fill="#534AB7" font-weight="500" text-anchor="middle" dominant-baseline="central">原则</text><text x="196" y="182" font-family="STHeiti" font-size="15" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">9 条核心原则，各写一句摘要</text><text x="196" y="211" font-family="STHeiti" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">1. 按目标和原则决策，待定时先完成独立工作。</text><text x="196" y="234" font-family="STHeiti" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">2. 不主动扩大需求范围。</text><text x="196" y="257" font-family="STHeiti" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">3. 不越层修改，框架改动先经批准。</text><text x="196" y="280" font-family="STHeiti" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">4. 一个 MR 只做一件事。</text><text x="196" y="303" font-family="STHeiti" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">5. 极简优先。</text><text x="196" y="326" font-family="STHeiti" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">6. 基于最新上游，在独立 worktree 工作。</text><text x="196" y="349" font-family="STHeiti" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">7. 结论标注实测、读代码或推断。</text><text x="196" y="372" font-family="STHeiti" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">8. 表达简洁，MR 能独立理解，引用可访问。</text><text x="196" y="395" font-family="STHeiti" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">9. 只交付必要内容；过程与临时产物留任务区。</text><text x="196" y="430" font-family="STHeiti" font-size="12" fill="#534AB7" font-weight="500" text-anchor="start" dominant-baseline="central">任务原则：仅本任务专属约束，每条一句；有才写。</text><text x="196" y="456" font-family="STHeiti" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">不重复核心原则，不抄讨论历史。</text><text x="196" y="480" font-family="STHeiti" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">摘要只用于 MR；执行与验收仍遵守完整规则。</text><rect x="40" y="510" width="130" height="174" fill="#FBEAF0" stroke="#993556" stroke-width="0.7" rx="9" /><rect x="180" y="510" width="460" height="174" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.7" rx="9" /><text x="105" y="597.0" font-family="STHeiti" font-size="16" fill="#993556" font-weight="500" text-anchor="middle" dominant-baseline="central">改动</text><text x="196" y="536" font-family="STHeiti" font-size="15" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">本 MR 的主要改动与行为结果</text><text x="196" y="564" font-family="STHeiti" font-size="13" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">重要选择才补充：理由 + 核心 / 任务原则编号</text><text x="196" y="592" font-family="STHeiti" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">确有取舍才说明；必要时给最小示例、对比或图表。</text><text x="196" y="620" font-family="STHeiti" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">多批次时说明本 MR 边界及必要依赖。</text><text x="196" y="656" font-family="STHeiti" font-size="12" fill="#993556" font-weight="500" text-anchor="start" dominant-baseline="central">不为每个实现细节套固定栏目。</text><rect x="40" y="696" width="130" height="230" fill="#FAECE7" stroke="#993C1D" stroke-width="0.7" rx="9" /><rect x="180" y="696" width="460" height="230" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="0.7" rx="9" /><text x="105" y="811.0" font-family="STHeiti" font-size="16" fill="#993C1D" font-weight="500" text-anchor="middle" dominant-baseline="central">验证</text><text x="196" y="720" font-family="STHeiti" font-size="15" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">必要结论与证据，按实际检查范围填写</text><rect x="196" y="744" width="428" height="128" fill="none" stroke="#B4B2A9" stroke-width="0.7" rx="0" /><line x1="196" y1="776" x2="624" y2="776" stroke="#B4B2A9" stroke-width="0.6" /><line x1="196" y1="808" x2="624" y2="808" stroke="#B4B2A9" stroke-width="0.6" /><line x1="196" y1="840" x2="624" y2="840" stroke="#B4B2A9" stroke-width="0.6" /><line x1="306" y1="744" x2="306" y2="872" stroke="#B4B2A9" stroke-width="0.6" /><line x1="538" y1="744" x2="538" y2="872" stroke="#B4B2A9" stroke-width="0.6" /><text x="204" y="760" font-family="STHeiti" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">检查</text><text x="314" y="760" font-family="STHeiti" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">结果</text><text x="546" y="760" font-family="STHeiti" font-size="13" fill="#2C2C2A" font-weight="500" text-anchor="start" dominant-baseline="central">证据</text><text x="204" y="792" font-family="STHeiti" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">专家验收</text><text x="314" y="792" font-family="STHeiti" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">最终完整轮 0 修改</text><text x="546" y="792" font-family="STHeiti" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">按实情</text><text x="204" y="824" font-family="STHeiti" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">适用检查</text><text x="314" y="824" font-family="STHeiti" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">实际检查范围及结果</text><text x="546" y="824" font-family="STHeiti" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">按实情</text><text x="204" y="856" font-family="STHeiti" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">CI / 合并性</text><text x="314" y="856" font-family="STHeiti" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">当前提交、CI 状态与冲突</text><text x="546" y="856" font-family="STHeiti" font-size="12" fill="#2C2C2A" font-weight="400" text-anchor="start" dominant-baseline="central">已核实</text><text x="196" y="898" font-family="STHeiti" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">未运行、失败或未知不能写通过；逐轮过程留台账。</text><text x="40" y="952" font-family="STHeiti" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">风险、截图、范围外建议和维护状态，有助于判断才补充；不留空栏目。</text><text x="40" y="978" font-family="STHeiti" font-size="12" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">MR 不重复维护操作流程；持续维护与远程恢复要求照常执行。</text></svg>